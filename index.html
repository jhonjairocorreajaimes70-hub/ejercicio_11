<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consentimiento de Cookies</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Iconos de FontAwesome para la galleta y la X -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Contenido de fondo (Layout simulado de la imagen) -->
  <div class="wireframe-container">
    <div class="header">
      <div class="logo"></div>
      <div class="nav-links">
        <span></span><span></span><span></span>
      </div>
    </div>
    <div class="banner"></div>
    <div class="sub-banner"></div>
    <div class="content-grid">
      <div class="column">
        <div class="line title"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
      </div>
      <div class="column">
        <div class="line title"></div>
        <div class="line"></div>
        <div class="line"></div>
        <div class="line"></div>
      </div>
    </div>
    <div class="cards">
      <div class="card"></div>
      <div class="card"></div>
    </div>
  </div>

  <!-- Modal / Popup de Consentimiento de Cookies -->
  <div class="cookie-popup" id="cookiePopup">
    <button class="close-btn" id="closeBtn">&times;</button>
    <div class="cookie-icon">
      <i class="fa-solid fa-cookie-bite"></i>
    </div>
    <p class="cookie-text">We use cookies to improve your user experience.</p>
    <button class="accept-btn" id="acceptBtn">I like Cookies</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
